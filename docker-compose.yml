services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: mro_intelligence
      POSTGRES_USER: mro
      POSTGRES_PASSWORD: mro
    ports:
      - "5432:5432"
    volumes:
      - mro_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mro -d mro_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mro_postgres:
